AWSTemplateFormatVersion: '2010-09-09'
Description: Hotfix B Wave B2 fixture — nested ARN rewrite (R13 + R14).

Resources:

  MyappStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: myapp-state-machine
      RoleArn: arn:aws:iam::111111111111:role/state-machine-role
      DefinitionString: |
        {
          "Comment": "Demo state machine",
          "StartAt": "InvokeSameAccount",
          "States": {
            "InvokeSameAccount": {
              "Type": "Task",
              "Resource": "arn:aws:lambda:ap-northeast-1:111111111111:function:local-task",
              "Next": "InvokeCrossAccount"
            },
            "InvokeCrossAccount": {
              "Type": "Task",
              "Resource": "arn:aws:lambda:us-east-1:999999999999:function:external-task",
              "End": true
            }
          }
        }

  MyappFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: myapp-function
      Runtime: python3.12
      Handler: index.handler
      Role: arn:aws:iam::111111111111:role/lambda-role
      Environment:
        Variables:
          DB_TABLE_ARN: arn:aws:dynamodb:ap-northeast-1:111111111111:table/foo
          PARTNER_QUEUE_ARN: arn:aws:sqs:us-east-1:999999999999:partner-queue

  MyappEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: myapp-rule
      ScheduleExpression: rate(5 minutes)
      Targets:
        - Id: target1
          Arn: arn:aws:lambda:ap-northeast-1:111111111111:function:another-local
          RoleArn: arn:aws:iam::111111111111:role/events-role

  MyappPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: myapp-policy
      Roles:
        - myapp-role
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - arn:aws:lambda:ap-northeast-1:111111111111:function:local-task
              - arn:aws:lambda:us-east-1:999999999999:function:external-task

  MyappBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: myapp-bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - arn:aws:iam::111111111111:role/local-role
                - arn:aws:iam::999999999999:role/partner-role
            Action: s3:GetObject
            Resource: arn:aws:s3:::myapp-bucket/*
